name: Bug Report
description: Report a bug in Commerzbank.NET
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Call method '...'
        2. With parameters '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: dropdown
    id: dotnet-version
    attributes:
      label: .NET Version
      options:
        - net10.0
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package Version
      description: NuGet package version.
      placeholder: e.g. 0.1.0-alpha
    validations:
      required: true
