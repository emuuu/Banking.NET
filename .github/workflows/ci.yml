name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build
        working-directory: tests/Banking.NET.Tests
        env:
          # Sandbox integration tests run only when these secrets are configured; they are skipped otherwise.
          COMMERZBANK_SANDBOX_CLIENT_ID: ${{ secrets.COMMERZBANK_SANDBOX_CLIENT_ID }}
          COMMERZBANK_SANDBOX_CLIENT_SECRET: ${{ secrets.COMMERZBANK_SANDBOX_CLIENT_SECRET }}
