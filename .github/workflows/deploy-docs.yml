name: Deploy Docs
on:
  push:
    branches: [main]
    paths:
      - 'docs/Banking.NET.Docs/**'
      - 'docs/Banking.NET.Docs.Generator/**'
      - 'src/Banking.NET/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish docs app
        run: dotnet publish docs/Banking.NET.Docs/Banking.NET.Docs.csproj -c Release -o output -p:DocsBasePath=/Banking.NET/
      - name: Verify base href (safeguard)
        # GenerateDocsData writes "/Banking.NET/" into every generated page (including 404.html) via
        # DocsBasePath, and the docs.csproj publish target rewrites the published index.html; this only
        # catches a regression where either stopped applying the base path.
        run: |
          for f in output/wwwroot/index.html output/wwwroot/404.html; do
            grep -q '<base href="/Banking.NET/" />' "$f" || { echo "::error::$f is missing the expected base href."; exit 1; }
          done
          if grep -rl '<base href="/" />' output/wwwroot/docs 2>/dev/null; then
            echo "::error::Generated doc pages still carry base href=\"/\" - DocsBasePath was not applied."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: output/wwwroot
      - id: deployment
        uses: actions/deploy-pages@v5
